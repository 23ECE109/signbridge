name: Deploy SignBridge Landing Page to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:   # Allow manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages:    write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group:   "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The landing page lives in web/
      # GitHub Pages will serve web/index.html at https://YOUR_USERNAME.github.io/signbridge/
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ folder as GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id:   deployment
        uses: actions/deploy-pages@v4
